<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spec-Driven Test Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDEFF2;
    --panel: #FFFFFF;
    --ink: #0B2A4A;
    --ink-soft: #4A5E73;
    --blue: #1E4D8C;
    --blue-soft: #E4EBF5;
    --line: #C7D0DA;
    --line-strong: #97A7B6;
    --pass: #1F8A5F;
    --pass-bg: #E6F4ED;
    --fail: #C23B3B;
    --fail-bg: #FBEAEA;
    --heal: #C98A1D;
    --heal-bg: #FBF1DF;
    --pending: #7C8B99;
    --pending-bg: #EEF0F2;
    --radius: 3px;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E1A26;
      --panel: #142434;
      --ink: #E8EEF4;
      --ink-soft: #9FB2C4;
      --blue: #6FA0DC;
      --blue-soft: #1B3550;
      --line: #2A3E52;
      --line-strong: #3E5872;
      --pass-bg: #10281E;
      --fail-bg: #2C1616;
      --heal-bg: #2B220E;
      --pending-bg: #1C2A38;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0E1A26;
    --panel: #142434;
    --ink: #E8EEF4;
    --ink-soft: #9FB2C4;
    --blue: #6FA0DC;
    --blue-soft: #1B3550;
    --line: #2A3E52;
    --line-strong: #3E5872;
    --pass-bg: #10281E;
    --fail-bg: #2C1616;
    --heal-bg: #2B220E;
    --pending-bg: #1C2A38;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--blue); color: #fff; }

  /* Layout shell */
  .shell {
    display: grid;
    grid-template-columns: 236px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .rail { display: none; }
    .rail.open { display: flex; position: fixed; inset: 0; z-index: 40; width: 100%; }
  }

  /* Rail nav */
  .rail {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 22px 0;
  }
  .rail-brand {
    padding: 0 20px 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .rail-brand .mark {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--ink-soft);
  }
  .rail-brand h1 {
    font-size: 17px;
    margin: 4px 0 2px;
    font-weight: 600;
    line-height: 1.25;
  }
  .rail-brand p {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .rail-stages { padding: 4px 10px; flex: 1; overflow-y: auto; }
  .rail-stage {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    cursor: pointer;
    padding: 9px 10px;
    border-radius: var(--radius);
    color: var(--ink);
    font-family: var(--sans);
    position: relative;
  }
  .rail-stage:hover { background: var(--blue-soft); }
  .rail-stage.active { background: var(--blue-soft); }
  .rail-stage.active .stage-idx { color: #fff; background: var(--blue); border-color: var(--blue); }
  .stage-idx {
    font-family: var(--mono);
    font-size: 10.5px;
    width: 20px; height: 20px;
    flex: none;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .stage-name { font-size: 13.5px; font-weight: 500; line-height: 1.3; }
  .stage-sub { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
  .rail-foot {
    padding: 12px 20px 0;
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 16px;
  }
  .project-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    padding: 18px;
    position: relative;
  }
  .project-card::before, .project-card::after {
    content: ""; position: absolute; width: 9px; height: 9px;
    border-color: var(--line-strong); border-style: solid; border-width: 0;
  }
  .project-card::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .project-card::after { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }
  .project-card h3 { margin: 0 0 3px; font-size: 15.5px; font-weight: 600; }
  .project-card .purl { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; word-break: break-all; }
  .project-card .pmeta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-bottom: 14px; }
  .branch-chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .branch-chip {
    font-family: var(--mono); font-size: 11px;
    border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 4px 10px 4px 8px; cursor: pointer; background: var(--paper);
    color: var(--ink); display: inline-flex; align-items: center; gap: 6px;
  }
  .branch-chip:hover { border-color: var(--blue); background: var(--blue-soft); }
  .branch-chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--pass); }
  .dot.bad { background: var(--fail); }
  .dot.none { background: var(--pending); }
  .chip-remove {
    margin-left: 1px; font-size: 12px; line-height: 1; color: var(--ink-soft);
    background: none; border: none; cursor: pointer; padding: 0 1px;
  }
  .chip-remove:hover { color: var(--fail); }
  .project-card .open-btn { width: 100%; }
  .remove-project-link {
    display: block; width: 100%; text-align: center; margin-top: 8px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    background: none; border: none; cursor: pointer; padding: 4px;
  }
  .remove-project-link:hover { color: var(--fail); }
  .new-project-card {
    border: 1.5px dashed var(--line-strong);
    border-radius: var(--radius);
    background: none;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 160px;
    cursor: pointer;
    color: var(--ink-soft);
    font-family: var(--sans);
  }
  .new-project-card:hover { border-color: var(--blue); background: var(--blue-soft); color: var(--ink); }
  .new-project-card .np-icon { font-size: 22px; line-height: 1; }
  .new-project-card .np-label { font-size: 13px; font-weight: 500; }
  .branch-chip.add-chip {
    background: none;
    border-style: dashed;
    color: var(--ink-soft);
  }
  .branch-chip.add-chip:hover { border-color: var(--blue); color: var(--ink); background: var(--blue-soft); }

  /* Modal (New Project) */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(11,42,74,.28);
    display: none; z-index: 60;
  }
  .modal-overlay.open { display: block; }
  .modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-48%);
    width: min(420px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    z-index: 61; display: none; flex-direction: column;
    max-height: calc(100vh - 48px); overflow: hidden;
  }
  .modal.open { display: flex; }
  .modal-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .modal-body { padding: 18px; overflow-y: auto; }
  .modal-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
  .field-error { font-size: 11.5px; color: var(--fail); margin-top: -10px; margin-bottom: 14px; display: none; }
  .field-error.show { display: block; }
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 12px; font-size: 12.5px;
  }
  .history-item .h-time { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .history-item .h-stats { font-family: var(--mono); font-size: 11.5px; display: flex; gap: 10px; }
  .h-stats .p { color: var(--pass); } .h-stats .f { color: var(--fail); } .h-stats .h { color: var(--heal); }
  .theme-toggle {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 5px 9px;
    cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--line-strong); }

  /* Main area */
  .main { padding: 26px 34px 60px; max-width: 1180px; }
  @media (max-width: 640px) { .main { padding: 18px 16px 48px; } }

  .topbar {
    display: none;
  }
  @media (max-width: 860px) {
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .topbar button { font-family: var(--mono); font-size: 12px; background: none; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; color: var(--ink); }
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .sheet-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 22px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .sheet-eyebrow { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin: 0 0 4px; }
  .sheet-head h2 { font-size: 24px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  .sheet-head .desc { color: var(--ink-soft); font-size: 13.5px; margin-top: 5px; max-width: 52ch; }
  .sheet-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); text-align: right; line-height: 1.6; }

  /* Drafting panel */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    position: relative;
    padding: 20px;
    margin-bottom: 18px;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 9px; height: 9px;
    border-color: var(--line-strong); border-style: solid; border-width: 0;
  }
  .panel::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .panel::after { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }
  .panel-title {
    font-size: 12.5px; font-weight: 600; text-transform: none;
    color: var(--ink); margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title .tag {
    font-family: var(--mono); font-size: 10px; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px;
  }

  label.field-label {
    display: block; font-size: 12px; font-weight: 500; color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  input[type=text], input[type=url], textarea, select {
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 11px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    color: var(--ink);
  }
  input:focus, textarea:focus, select:focus, button:focus-visible, .rail-stage:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 1px;
  }

  .dropzone {
    border: 1.5px dashed var(--line-strong);
    border-radius: var(--radius);
    padding: 26px 16px;
    text-align: center;
    cursor: pointer;
    background: var(--paper);
  }
  .dropzone:hover { border-color: var(--blue); background: var(--blue-soft); }
  .dropzone .dz-title { font-weight: 500; font-size: 13.5px; }
  .dropzone .dz-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; font-family: var(--mono); }
  .dropzone.filled { border-style: solid; border-color: var(--pass); background: var(--pass-bg); }

  .check-row { display: flex; flex-wrap: wrap; gap: 8px 22px; }
  .check-item { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .check-item input { width: auto; accent-color: var(--blue); }

  .btn {
    font-family: var(--sans); font-size: 13.5px; font-weight: 500;
    padding: 9px 16px; border-radius: var(--radius); cursor: pointer;
    border: 1px solid var(--ink);
  }
  .btn-primary { background: var(--ink); color: var(--panel); }
  .btn-danger { background: var(--fail); color: #fff; border-color: var(--fail); }
  .btn-danger:hover { opacity: .88; }
  .btn-danger:disabled { opacity: .35; }
  .btn-primary:hover { background: var(--blue); border-color: var(--blue); }
  .btn-ghost { background: none; color: var(--ink); border-color: var(--line-strong); }
  .btn-ghost:hover { border-color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

  /* Spec cards */
  .spec-card { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .spec-card-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--paper); border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px;
  }
  .spec-card-head .id { color: var(--blue); font-weight: 600; }
  .spec-card-body { padding: 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; color: var(--ink-soft); }
  .spec-card-body .k { color: var(--ink); }
  .approve-row { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .approve-row .btn { padding: 5px 12px; font-size: 12px; }
  .pill { font-family: var(--mono); font-size: 10.5px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
  .pill-approved { background: var(--pass-bg); color: var(--pass); }
  .pill-pending { background: var(--pending-bg); color: var(--pending); }

  /* Table */
  table.runs { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.runs th {
    text-align: left; font-family: var(--mono); font-size: 10.5px; font-weight: 500;
    color: var(--ink-soft); padding: 8px 12px; border-bottom: 1px solid var(--line-strong);
  }
  table.runs td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.runs tr.row-clickable { cursor: pointer; }
  table.runs tr.row-clickable:hover { background: var(--blue-soft); }
  .tc-id { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 600;
    padding: 3px 9px; border-radius: 10px;
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
  .status-pass { background: var(--pass-bg); color: var(--pass); }
  .status-pass::before { background: var(--pass); }
  .status-fail { background: var(--fail-bg); color: var(--fail); }
  .status-fail::before { background: var(--fail); }
  .status-heal { background: var(--heal-bg); color: var(--heal); }
  .status-heal::before { background: var(--heal); animation: pulse 1.1s infinite; }
  .status-pending { background: var(--pending-bg); color: var(--pending); }
  .status-pending::before { background: var(--pending); }
  .status-run { background: var(--blue-soft); color: var(--blue); }
  .status-run::before { background: var(--blue); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .summary-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-box { flex: 1 1 120px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); }
  .stat-box .num { font-family: var(--mono); font-size: 24px; font-weight: 600; line-height: 1; }
  .stat-box .lbl { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
  .stat-box.pass .num { color: var(--pass); }
  .stat-box.fail .num { color: var(--fail); }
  .stat-box.heal .num { color: var(--heal); }

  /* Drawer */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(11,42,74,.28);
    display: none; z-index: 50;
  }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .22s ease;
    z-index: 51; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .drawer-head h3 { margin: 0 0 3px; font-size: 16px; font-weight: 600; }
  .drawer-head .sub { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
  .drawer-close { background: none; border: 1px solid var(--line); border-radius: var(--radius); width: 26px; height: 26px; cursor: pointer; color: var(--ink); font-size: 14px; line-height: 1; flex: none; }
  .drawer-tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .d-tab {
    background: none; border: none; padding: 10px 10px; font-family: var(--sans); font-size: 12.5px;
    color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .d-tab.active { color: var(--ink); border-bottom-color: var(--blue); font-weight: 500; }
  .drawer-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .d-pane { display: none; }
  .d-pane.active { display: block; }
  .code-block {
    font-family: var(--mono); font-size: 12px; line-height: 1.7;
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; white-space: pre-wrap; color: var(--ink); overflow-x: auto;
  }
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--line-strong); }
  .t-item { position: relative; padding-bottom: 16px; }
  .t-item::before { content: ""; position: absolute; left: -20px; top: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--blue); }
  .t-item .t-time { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); }
  .t-item .t-label { font-size: 13px; margin-top: 2px; }
  .evidence-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
  .ev-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: center; }
  .ev-icon { font-size: 20px; }
  .ev-name { font-family: var(--mono); font-size: 11px; margin-top: 6px; color: var(--ink-soft); }
  .heal-entry { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .heal-entry .hl { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); display: flex; justify-content: space-between; margin-bottom: 6px; }
  .heal-diff { font-family: var(--mono); font-size: 12px; line-height: 1.6; }
  .heal-diff .rm { color: var(--fail); text-decoration: line-through; opacity: .7; }
  .heal-diff .ad { color: var(--pass); }

  .empty-note { font-size: 13px; color: var(--ink-soft); padding: 10px 0; }

  .bar-chart { display: flex; align-items: flex-end; gap: 14px; height: 140px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar { width: 100%; max-width: 46px; border-radius: 2px 2px 0 0; }
  .bar-val { font-family: var(--mono); font-size: 11px; margin-bottom: 4px; }
  .bar-lbl { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-top: 6px; text-align: center; }

  .footer-note { font-size: 12px; color: var(--ink-soft); margin-top: 30px; border-top: 1px solid var(--line); padding-top: 14px; font-family: var(--mono); }

  /* ================= v2 additions ================= */

  /* Text-safe status colors (WCAG 2.1 AA, Constitution XVII).
     The reserved status colors stay for dots, fills and borders; these
     variants are used for TEXT on the tinted backgrounds. */
  :root {
    --pass-ink: #146B47; --fail-ink: #A82D2D; --heal-ink: #7A5200; --pending-ink: #4F5C68;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --pass-ink: #5FD39C; --fail-ink: #FF8A8A; --heal-ink: #F0B95A; --pending-ink: #A9B8C6;
    }
  }
  :root[data-theme="dark"] {
    --pass-ink: #5FD39C; --fail-ink: #FF8A8A; --heal-ink: #F0B95A; --pending-ink: #A9B8C6;
  }
  .status-pass { color: var(--pass-ink); }
  .status-fail { color: var(--fail-ink); }
  .status-heal { color: var(--heal-ink); }
  .status-pending { color: var(--pending-ink); }
  .status-g2 { background: var(--heal-bg); color: var(--heal-ink); }
  .status-g2::before { background: var(--heal); }
  .status-cancel { background: var(--pending-bg); color: var(--pending-ink); }
  .status-cancel::before { background: var(--pending); border-radius: 1px; }
  .status-excluded { background: none; color: var(--ink-soft); border: 1px dashed var(--line-strong); }
  .status-excluded::before { display: none; }
  .pill-approved { color: var(--pass-ink); }
  .pill-pending { color: var(--pending-ink); }
  .pill-clarify { background: var(--heal-bg); color: var(--heal-ink); }
  .pill-stale { background: var(--fail-bg); color: var(--fail-ink); }
  .pill-flag { background: var(--heal-bg); color: var(--heal-ink); }
  .pill-clean { background: var(--pass-bg); color: var(--pass-ink); }
  .h-stats .p { color: var(--pass-ink); } .h-stats .f { color: var(--fail-ink); } .h-stats .h { color: var(--heal-ink); }
  .stat-box.pass .num { color: var(--pass-ink); }
  .stat-box.fail .num { color: var(--fail-ink); }
  .stat-box.heal .num { color: var(--heal-ink); }
  .heal-diff .rm { color: var(--fail-ink); opacity: 1; }
  .heal-diff .ad { color: var(--pass-ink); }
  .chip-remove:hover { color: var(--fail-ink); }
  .remove-project-link:hover { color: var(--fail-ink); }
  .field-error { color: var(--fail-ink); }

  /* Utilities */
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .skip-link { position: absolute; left: 8px; top: -60px; background: var(--ink); color: var(--panel); padding: 8px 14px; z-index: 200; border-radius: var(--radius); font-size: 13px; }
  .skip-link:focus { top: 8px; }
  .muted { color: var(--ink-soft); }
  .mono { font-family: var(--mono); }
  .small { font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; }
  .mt { margin-top: 14px; } .mb { margin-bottom: 14px; }
  .table-scroll { overflow-x: auto; }
  a.link, button.link { background: none; border: none; padding: 0; color: var(--blue); text-decoration: underline; cursor: pointer; font: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  h2[tabindex="-1"]:focus-visible { outline: 2px solid var(--blue); }

  /* Motion: honor the user's setting (Constitution XVII, spec 019 FR-007) */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  /* Rail additions */
  .rail-foot { display: flex; flex-direction: column; gap: 8px; }
  .acct-btn { width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; color: var(--ink); font-family: var(--sans); }
  .acct-btn:hover { border-color: var(--line-strong); }
  .acct-name { display: block; font-size: 13px; font-weight: 500; }
  .acct-role { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }
  .menu { position: absolute; bottom: 78px; left: 14px; right: 14px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); z-index: 45; padding: 6px; display: none; }
  .menu.open { display: block; }
  .menu button, .menu a { display: block; width: 100%; text-align: left; background: none; border: none; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; border-radius: var(--radius); text-decoration: none; }
  .menu button:hover, .menu a:hover { background: var(--blue-soft); }
  .menu .menu-note { padding: 6px 10px 8px; font-size: 11.5px; color: var(--ink-soft); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .rail { position: relative; }
  .rail.open { overflow-y: auto; }
  .rail-close { display: none; }
  @media (max-width: 860px) { .rail.open .rail-close { display: block; margin: 0 20px 12px auto; } }
  .topbar button { min-height: 32px; }

  /* Header meta: role + settings */
  .role-badge { font-family: var(--mono); font-size: 10.5px; padding: 2px 8px; border-radius: 10px; background: var(--blue-soft); color: var(--blue); border: 1px solid var(--line); }
  .ctx-links { display: flex; gap: 12px; justify-content: flex-end; margin-top: 4px; font-family: var(--sans); font-size: 12px; }

  /* Project cards */
  .projects-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .projects-bar input[type=text] { max-width: 260px; }
  .projects-bar select { width: auto; }
  .legend { font-size: 11.5px; color: var(--ink-soft); display: flex; gap: 14px; align-items: center; margin-left: auto; }
  .legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .branch-chip { padding: 0; cursor: default; }
  .branch-chip .chip-open { font-family: var(--mono); font-size: 11px; background: none; border: none; color: var(--ink); cursor: pointer; padding: 4px 4px 4px 9px; display: inline-flex; align-items: center; gap: 6px; }
  .branch-chip .chip-remove { padding: 4px 8px 4px 2px; }
  .branch-chip.add-chip button { font-family: var(--mono); font-size: 11px; background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 4px 10px; }
  .project-card .role-line { margin-bottom: 10px; }
  .no-access { border: 1px dashed var(--line-strong); padding: 28px; text-align: center; border-radius: var(--radius); }

  /* Fields / helpers */
  .field-hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
  .field-hint.warn { color: var(--heal-ink); }
  .field-hint.bad { color: var(--fail-ink); }
  .field-hint.good { color: var(--pass-ink); }
  input[type=text], input[type=url], input[type=search], input[type=password], input[type=number], textarea, select {
    width: 100%; font-family: var(--mono); font-size: 13px; padding: 9px 11px; background: var(--paper);
    border: 1px solid var(--line-strong); border-radius: var(--radius); color: var(--ink);
  }
  input[disabled], select[disabled], textarea[disabled] { opacity: .6; }
  .inline-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 13px; }
  .kv dt { color: var(--ink-soft); font-size: 12px; } .kv dd { margin: 0; }

  /* Dropzone (real control) */
  .dropzone { display: block; width: 100%; font: inherit; color: var(--ink); }
  .dropzone.drag { border-color: var(--blue); background: var(--blue-soft); }
  .dropzone.error { border-color: var(--fail); background: var(--fail-bg); }
  .parse-list { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12.5px; text-align: left; }
  .parse-list li { padding: 3px 0; }

  /* Busy / progress */
  .busy { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); font-size: 13px; margin: 10px 0; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line-strong); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress { height: 8px; background: var(--pending-bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .progress > i { display: block; height: 100%; background: var(--blue); width: 0; transition: width .3s; }
  .errbox { border: 1px solid var(--fail); background: var(--fail-bg); color: var(--ink); border-radius: var(--radius); padding: 12px 14px; margin: 10px 0; font-size: 13px; }
  .errbox strong { color: var(--fail-ink); }
  .errbox details { margin-top: 6px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
  .banner { border: 1px solid var(--heal); background: var(--heal-bg); color: var(--ink); padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner.info { border-color: var(--blue); background: var(--blue-soft); }
  .banner.bad { border-color: var(--fail); background: var(--fail-bg); }
  .banner.good { border-color: var(--pass); background: var(--pass-bg); }

  /* Toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 120; max-width: min(380px, calc(100% - 32px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .toast { background: var(--ink); color: var(--panel); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; border-left: 4px solid var(--blue); }
  .toast.good { border-left-color: var(--pass); } .toast.bad { border-left-color: var(--fail); } .toast.warn { border-left-color: var(--heal); }

  /* Dialogs (generic) */
  .modal { width: min(460px, calc(100% - 32px)); }
  .modal.wide { width: min(680px, calc(100% - 32px)); }
  .modal-body p { margin: 0 0 12px; font-size: 13.5px; line-height: 1.6; }
  .check-list { list-style: none; margin: 0; padding: 0; }
  .check-list li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .check-list label { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
  .check-list input { width: auto; margin-top: 3px; accent-color: var(--blue); }
  .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 14px; }
  .preview-grid div { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
  .preview-grid b { display: block; font-family: var(--mono); font-size: 18px; }
  .preview-grid span { font-size: 11px; color: var(--ink-soft); }

  /* Tabs (generic, accessible) */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 12px; font: inherit; font-size: 13px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); font-weight: 500; }
  .tab-panel[hidden] { display: none; }

  /* Filter bar */
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--paper); }
  .filter-bar input[type=search], .filter-bar input[type=text] { max-width: 220px; }
  .filter-bar select { width: auto; }
  .filter-bar .count { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
  .chipbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchip { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-strong); border-radius: 12px; padding: 3px 10px; background: none; color: var(--ink); cursor: pointer; }
  .fchip[aria-pressed="true"] { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* Steps strip */
  .steps { display: flex; gap: 0; margin-bottom: 18px; flex-wrap: wrap; }
  .step { flex: 1 1 160px; border: 1px solid var(--line); padding: 10px 14px; background: var(--panel); font-size: 12.5px; }
  .step + .step { border-left: none; }
  .step b { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); font-weight: 500; }
  .step.done b::after { content: " · done"; color: var(--pass-ink); }
  .step.now { background: var(--blue-soft); border-color: var(--blue); }
  .step.now b::after { content: " · in progress"; color: var(--blue); }
  .browser-cells { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .bcell { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-strong); border-radius: 3px; padding: 1px 5px; color: var(--ink-soft); }
  .bcell.pass { color: var(--pass-ink); border-color: var(--pass); } .bcell.fail { color: var(--fail-ink); border-color: var(--fail); }
  .bcell.g2 { color: var(--heal-ink); border-color: var(--heal); }
  .gen-chip { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); }
  .gen-chip.ready { color: var(--pass-ink); } .gen-chip.stale, .gen-chip.blocked { color: var(--fail-ink); }
  .reason { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
  .checks { list-style: none; margin: 0 0 12px; padding: 0; font-size: 12.5px; }
  .checks li { padding: 3px 0; display: flex; gap: 8px; }
  .checks .ok { color: var(--pass-ink); } .checks .no { color: var(--fail-ink); } .checks .wn { color: var(--heal-ink); }
  .sig { font-size: 11.5px; color: var(--ink-soft); font-family: var(--mono); }

  /* Report */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .kpi { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); }
  .kpi b { display: block; font-family: var(--mono); font-size: 20px; }
  .kpi span { font-size: 11.5px; color: var(--ink-soft); display: block; margin-top: 4px; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 32px; margin-top: 6px; }
  .spark i { flex: 1; background: var(--blue); min-width: 5px; opacity: .8; }
  .mr-panel { border: 1px solid var(--line-strong); border-left: 4px solid var(--heal); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px; background: var(--panel); font-size: 13px; }
  .mr-panel.ok { border-left-color: var(--pass); }
  .mr-panel .mono { font-size: 12px; }
  .signoff { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 16px; background: var(--panel); margin-bottom: 18px; }
  .signoff.signed { border-color: var(--pass); background: var(--pass-bg); }
  .bar-lbl { font-size: 10px; }

  /* Drawer tabs + evidence viewer */
  .drawer-tabs { flex-wrap: nowrap; }
  .ev-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
  .ev-list button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; font: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .ev-list button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
  .ev-list .meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); }
  .ev-list .bad { color: var(--fail-ink); }
  .viewer { border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); padding: 12px; }
  .viewer-tools { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
  .viewer-tools button { border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); border-radius: var(--radius); padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .shot { overflow: auto; max-height: 240px; border: 1px solid var(--line); background: #fff; }
  .shot svg { display: block; transform-origin: top left; }
  .player { background: #0b1520; color: #fff; border-radius: var(--radius); padding: 12px; }
  .player .screen-fake { height: 120px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; color: #9FB2C4; border: 1px solid #2A3E52; margin-bottom: 8px; }
  .player .bar { height: 6px; background: #2A3E52; border-radius: 3px; overflow: hidden; max-width: none; }
  .player .bar i { display: block; height: 100%; width: 0; background: #6FA0DC; }
  .player button { background: #6FA0DC; border: none; border-radius: 3px; padding: 4px 10px; color: #0b1520; font-weight: 600; cursor: pointer; font-size: 12px; margin-right: 8px; }
  .trace { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .trace { grid-template-columns: 1fr; } }
  .trace ol { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .trace li button { width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-bottom: none; padding: 6px 8px; font: inherit; font-family: var(--mono); font-size: 11px; color: var(--ink); cursor: pointer; }
  .trace li:last-child button { border-bottom: 1px solid var(--line); }
  .trace li button[aria-current="true"] { background: var(--blue-soft); border-color: var(--blue); }
  .snapshot { border: 1px solid var(--line); background: var(--panel); padding: 10px; font-family: var(--mono); font-size: 11px; min-height: 110px; }
  .snapshot mark { background: var(--heal-bg); color: var(--heal-ink); outline: 1px solid var(--heal); }
  pre.log { max-height: 220px; overflow: auto; margin: 8px 0 0; font-family: var(--mono); font-size: 11.5px; background: var(--paper); border: 1px solid var(--line); padding: 8px; white-space: pre-wrap; }
  .side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .side-by-side { grid-template-columns: 1fr; } }
  .side-by-side > div { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; font-size: 12.5px; }
  .side-by-side h4 { margin: 0 0 6px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); font-weight: 500; }

  /* Settings / admin / audit */
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  .switch input { width: auto; accent-color: var(--blue); }
  .setting { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .setting:last-child { border-bottom: none; }
  .setting h4 { margin: 0 0 3px; font-size: 13.5px; font-weight: 600; }
  .setting p { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-soft); }
  .setting .sig { display: block; margin-top: 6px; }
  .unsaved { font-family: var(--mono); font-size: 11px; color: var(--heal-ink); margin-left: 8px; }
  .readonly-note { font-size: 12.5px; padding: 8px 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius); margin-bottom: 14px; color: var(--ink-soft); }
  .audit-detail { background: var(--paper); font-family: var(--mono); font-size: 11.5px; padding: 8px 12px; }
  .stateful { text-align: center; padding: 60px 20px; max-width: 520px; margin: 40px auto; }
  .stateful h2 { font-size: 22px; margin: 0 0 8px; }
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--paper); }
  .auth-card { width: min(420px, 100%); }

  .burls { margin: -6px 0 12px; font-size: 11.5px; }
  .burls summary { cursor: pointer; color: var(--ink-soft); font-family: var(--mono); font-size: 11px; }
  .burls ul { list-style: none; margin: 6px 0 0; padding: 0; }
  .burls li { padding: 2px 0; word-break: break-all; }
  /* Demo controls (mockup only) */
  #demoBtn { position: fixed; left: 12px; bottom: 12px; z-index: 110; font-family: var(--mono); font-size: 11px; background: var(--ink); color: var(--panel); border: none; border-radius: var(--radius); padding: 7px 11px; cursor: pointer; }
  #demoPanel { position: fixed; left: 12px; bottom: 50px; z-index: 110; width: min(340px, calc(100% - 24px)); max-height: calc(100vh - 80px); overflow: auto; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 14px; display: none; }
  #demoPanel.open { display: block; }
  #demoPanel h3 { margin: 0 0 4px; font-size: 13px; }
  #demoPanel .warn { font-size: 11.5px; color: var(--heal-ink); margin: 0 0 10px; }
  #demoPanel fieldset { border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 10px; padding: 8px 10px; }
  #demoPanel legend { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); padding: 0 4px; }
  #demoPanel .btn { padding: 5px 10px; font-size: 12px; margin: 2px 2px 2px 0; }
  #demoPanel label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; margin: 4px 0; }
  #demoPanel input, #demoPanel select { width: auto; }
  @media (max-width: 860px) { #demoBtn { bottom: 64px; } #demoPanel { bottom: 100px; } }

  /* A closed drawer must not be reachable by keyboard */
  .drawer:not(.open) { visibility: hidden; }

  /* AA in both themes: text on the accent uses the panel color (white in light, dark in dark) */
  .fchip[aria-pressed="true"] { color: var(--panel); }
  .rail-stage.active .stage-idx { color: var(--panel); }
  /* keep floating demo controls clear of phone home bars */
  #demoBtn { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  #demoPanel { bottom: calc(50px + env(safe-area-inset-bottom, 0px)); }
  @media (max-width: 860px) { #demoBtn { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); } #demoPanel { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); } }

  /* ================= v2 additions ================= */

  /* Text-safe status colors (WCAG 2.1 AA, Constitution XVII).
     The reserved status colors stay for dots, fills and borders; these
     variants are used for TEXT on the tinted backgrounds. */
  :root {
    --pass-ink: #146B47; --fail-ink: #A82D2D; --heal-ink: #7A5200; --pending-ink: #4F5C68;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --pass-ink: #5FD39C; --fail-ink: #FF8A8A; --heal-ink: #F0B95A; --pending-ink: #A9B8C6;
    }
  }
  :root[data-theme="dark"] {
    --pass-ink: #5FD39C; --fail-ink: #FF8A8A; --heal-ink: #F0B95A; --pending-ink: #A9B8C6;
  }
  .status-pass { color: var(--pass-ink); }
  .status-fail { color: var(--fail-ink); }
  .status-heal { color: var(--heal-ink); }
  .status-pending { color: var(--pending-ink); }
  .status-g2 { background: var(--heal-bg); color: var(--heal-ink); }
  .status-g2::before { background: var(--heal); }
  .status-cancel { background: var(--pending-bg); color: var(--pending-ink); }
  .status-cancel::before { background: var(--pending); border-radius: 1px; }
  .status-excluded { background: none; color: var(--ink-soft); border: 1px dashed var(--line-strong); }
  .status-excluded::before { display: none; }
  .pill-approved { color: var(--pass-ink); }
  .pill-pending { color: var(--pending-ink); }
  .pill-clarify { background: var(--heal-bg); color: var(--heal-ink); }
  .pill-stale { background: var(--fail-bg); color: var(--fail-ink); }
  .pill-flag { background: var(--heal-bg); color: var(--heal-ink); }
  .pill-clean { background: var(--pass-bg); color: var(--pass-ink); }
  .h-stats .p { color: var(--pass-ink); } .h-stats .f { color: var(--fail-ink); } .h-stats .h { color: var(--heal-ink); }
  .stat-box.pass .num { color: var(--pass-ink); }
  .stat-box.fail .num { color: var(--fail-ink); }
  .stat-box.heal .num { color: var(--heal-ink); }
  .heal-diff .rm { color: var(--fail-ink); opacity: 1; }
  .heal-diff .ad { color: var(--pass-ink); }
  .chip-remove:hover { color: var(--fail-ink); }
  .remove-project-link:hover { color: var(--fail-ink); }
  .field-error { color: var(--fail-ink); }

  /* Utilities */

  .skip-link { position: absolute; left: 8px; top: -60px; background: var(--ink); color: var(--panel); padding: 8px 14px; z-index: 200; border-radius: var(--radius); font-size: 13px; }
  .skip-link:focus { top: 8px; }
  .muted { color: var(--ink-soft); }
  .mono { font-family: var(--mono); }
  .small { font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; }
  .mt { margin-top: 14px; } .mb { margin-bottom: 14px; }

  [tabindex="-1"]:focus { outline: none; }
  h2[tabindex="-1"]:focus-visible { outline: 2px solid var(--blue); }

  /* Motion: honor the user's setting (Constitution XVII, spec 019 FR-007) */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  /* Rail additions */

  .acct-btn { width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; color: var(--ink); font-family: var(--sans); }

  .menu { position: absolute; bottom: 78px; left: 14px; right: 14px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); z-index: 45; padding: 6px; display: none; }
  .menu.open { display: block; }

  .ctx-links { display: flex; gap: 12px; justify-content: flex-end; margin-top: 4px; font-family: var(--sans); font-size: 12px; }

  /* Project cards */
  .projects-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }

  .projects-bar select { width: auto; }
  .legend { font-size: 11.5px; color: var(--ink-soft); display: flex; gap: 14px; align-items: center; margin-left: auto; }
  .legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .branch-chip { padding: 0; cursor: default; }

  .branch-chip .chip-remove { padding: 4px 8px 4px 2px; }

  /* Fields / helpers */

  .field-hint.warn { color: var(--heal-ink); }
  .field-hint.bad { color: var(--fail-ink); }
  .field-hint.good { color: var(--pass-ink); }
  input[type=text], input[type=url], input[type=search], input[type=password], input[type=number], textarea, select {
    width: 100%; font-family: var(--mono); font-size: 13px; padding: 9px 11px; background: var(--paper);
    border: 1px solid var(--line-strong); border-radius: var(--radius); color: var(--ink);
  }
  input[disabled], select[disabled], textarea[disabled] { opacity: .6; }
  .inline-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 13px; }
  .kv dt { color: var(--ink-soft); font-size: 12px; } .kv dd { margin: 0; }

  /* Dropzone (real control) */
  .dropzone { display: block; width: 100%; font: inherit; color: var(--ink); }
  .dropzone.drag { border-color: var(--blue); background: var(--blue-soft); }
  .dropzone.error { border-color: var(--fail); background: var(--fail-bg); }
  .parse-list { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12.5px; text-align: left; }
  .parse-list li { padding: 3px 0; }

  /* Busy / progress */
  .busy { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); font-size: 13px; margin: 10px 0; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line-strong); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress { height: 8px; background: var(--pending-bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .progress > i { display: block; height: 100%; background: var(--blue); width: 0; transition: width .3s; }
  .errbox { border: 1px solid var(--fail); background: var(--fail-bg); color: var(--ink); border-radius: var(--radius); padding: 12px 14px; margin: 10px 0; font-size: 13px; }
  .errbox strong { color: var(--fail-ink); }
  .errbox details { margin-top: 6px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
  .banner { border: 1px solid var(--heal); background: var(--heal-bg); color: var(--ink); padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner.info { border-color: var(--blue); background: var(--blue-soft); }
  .banner.bad { border-color: var(--fail); background: var(--fail-bg); }
  .banner.good { border-color: var(--pass); background: var(--pass-bg); }

  /* Toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 120; max-width: min(380px, calc(100% - 32px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .toast { background: var(--ink); color: var(--panel); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; border-left: 4px solid var(--blue); }
  .toast.good { border-left-color: var(--pass); } .toast.bad { border-left-color: var(--fail); } .toast.warn { border-left-color: var(--heal); }

  /* Dialogs (generic) */
  .modal { width: min(460px, calc(100% - 32px)); }

  /* Tabs (generic, accessible) */

  .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 12px; font: inherit; font-size: 13px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); font-weight: 500; }
  .tab-panel[hidden] { display: none; }

  /* Filter bar */

  .filter-bar input[type=search], .filter-bar input[type=text] { max-width: 220px; }
  .filter-bar select { width: auto; }
  .filter-bar .count { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
  .chipbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchip { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-strong); border-radius: 12px; padding: 3px 10px; background: none; color: var(--ink); cursor: pointer; }
  .fchip[aria-pressed="true"] { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* Steps strip */
  .steps { display: flex; gap: 0; margin-bottom: 18px; flex-wrap: wrap; }
  .step { flex: 1 1 160px; border: 1px solid var(--line); padding: 10px 14px; background: var(--panel); font-size: 12.5px; }
  .step + .step { border-left: none; }
  .step b { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); font-weight: 500; }
  .step.done b::after { content: " · done"; color: var(--pass-ink); }

  .browser-cells { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .bcell { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-strong); border-radius: 3px; padding: 1px 5px; color: var(--ink-soft); }
  .bcell.pass { color: var(--pass-ink); border-color: var(--pass); } .bcell.fail { color: var(--fail-ink); border-color: var(--fail); }

  /* Report */

  .kpi { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); }
  .kpi b { display: block; font-family: var(--mono); font-size: 20px; }
  .kpi span { font-size: 11.5px; color: var(--ink-soft); display: block; margin-top: 4px; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 32px; margin-top: 6px; }
  .spark i { flex: 1; background: var(--blue); min-width: 5px; opacity: .8; }
  .mr-panel { border: 1px solid var(--line-strong); border-left: 4px solid var(--heal); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px; background: var(--panel); font-size: 13px; }

  .signoff.signed { border-color: var(--pass); background: var(--pass-bg); }

  /* Drawer tabs + evidence viewer */

  /* keep floating demo controls clear of phone home bars */

  function specById(id){ return SPECS.filter(function(s){ return s.id === id; })[0]; }

      '\n\nsteps:\n' + s.steps.map(function(x){ return '  - ' + x; }).join('\n') +
      '\n\nassertions:\n' + s.asserts.map(function(x){ return '  - ' + x; }).join('\n');
  }

  // ---------- per project + branch state (Constitution VII: isolation) ----------

  // ---------- announcements, toasts ----------
  function announce(msg){ var l = $('live'); l.textContent = ''; setTimeout(function(){ l.textContent = msg; }, 30); }

  // ---------- dialogs: real dialog semantics, focus trap, Escape (spec 019 FR-004) ----------
  var dlgStack = [], dlgSeq = 0;
  function setInert(){
    var on = dlgStack.length > 0 || $('drawer').classList.contains('open');

    else { app.removeAttribute('inert'); app.removeAttribute('aria-hidden'); }
  }
  function dialog(o){
    return new Promise(function(resolve){
      var id = 'dlg' + (++dlgSeq), opener = document.activeElement;
      var ov = document.createElement('div'); ov.className = 'modal-overlay open';
      var m = document.createElement('div'); m.className = 'modal open' + (o.wide ? ' wide' : '');

      m.innerHTML = '<div class="modal-head"><h3 id="' + id + 't">' + esc(o.title) + '</h3><button class="drawer-close" type="button" data-dclose aria-label="Close dialog">✕</button></div>' +
        '<div class="modal-body">' + (o.body || '') + '</div><div class="modal-foot"></div>';
      var foot = qs('.modal-foot', m);
      (o.buttons || [{ label:'OK', kind:'primary', value:true }]).forEach(function(b, i){

        el.textContent = b.label; el.setAttribute('data-bi', i); if (b.id) el.id = b.id; if (b.disabled) el.disabled = true;
        foot.appendChild(el);
      });
      var cancelVal = o.cancelValue === undefined ? false : o.cancelValue;
      function close(v){
        if (ov.parentNode) ov.parentNode.removeChild(ov); if (m.parentNode) m.parentNode.removeChild(m);
        dlgStack = dlgStack.filter(function(d){ return d.el !== m; }); setInert();
        if (opener && opener.focus && document.contains(opener)) { try { opener.focus(); } catch (e) {} }
        resolve(v);
      }
      ov.addEventListener('click', function(){ close(cancelVal); });

        if (e.target.closest('[data-dclose]')) { close(cancelVal); return; }
        var b = e.target.closest('[data-bi]'); if (!b || b.disabled) return;
        var def = o.buttons[+b.getAttribute('data-bi')];
        if (def.validate && def.validate(m) === false) return;
        close(def.value);
      });
      $('dlgRoot').appendChild(ov); $('dlgRoot').appendChild(m);
      dlgStack.push({ el: m, close: close, cancel: cancelVal }); setInert();
      if (o.onOpen) o.onOpen(m, close);
      var first = qs('input:not([disabled]), select, textarea', m) || qs('.btn-primary:not([disabled])', foot) || qs('.btn', foot);
      if (first) first.focus();
    });
  }
  function notice(title, msg){ return dialog({ title: title, body: '<p>' + msg + '</p>', buttons:[{ label:'OK', kind:'primary', value:true }], cancelValue:true }); }
  function focusables(root){ return qsa('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', root); }
  function trapTab(e, root){
    var f = focusables(root); if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  document.addEventListener('keydown', function(e){
    if (dlgStack.length) {
      var top = dlgStack[dlgStack.length - 1];
      if (e.key === 'Escape') { e.preventDefault(); top.close(top.cancel); }
      else if (e.key === 'Tab') trapTab(e, top.el);

      if (e.key === 'Escape') { e.preventDefault(); closeDrawer(); }
      else if (e.key === 'Tab') trapTab(e, $('drawer'));

  function renderAudit(){
    var html = head('audit', 'ORGANIZATION', 'Audit trail', 'Who did what, and when: gate decisions, heals, removals, restorations, role and setting changes, and automated actions. It can be read and exported here — never edited.', '<span class="role-badge">' + esc(roleIn() || 'no role') + '</span>');

    }
    var all = AUDIT.filter(function(e){ return !e.pid || can('audit', e.pid); }).slice().sort(function(a, b){ return b.at - a.at; });
    var actions = Array.from(new Set(all.map(function(e){ return e.action; }))).sort(), actors = Array.from(new Set(all.map(function(e){ return e.actor; }))).sort();
    var q = ui.auditQ.trim().toLowerCase(), cut = ui.auditRange === '24h' ? Date.now() - 864e5 : ui.auditRange === '7d' ? Date.now() - 6048e5 : 0;
    var rows = all.filter(function(e){ return (ui.auditAction === 'all' || e.action === ui.auditAction) && (ui.auditActor === 'all' || e.actor === ui.auditActor) && +e.at >= cut && (!q || (e.target + ' ' + e.detail + ' ' + e.action + ' ' + e.actor).toLowerCase().indexOf(q) > -1); });
    var shown = rows.slice(0, ui.auditLimit || 10);
    function opt(list, cur, allLabel){ return '<option value="all">' + allLabel + '</option>' + list.map(function(x){ return '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); }
    html += '<div class="panel" style="padding:0"><div class="filter-bar"><label class="sr-only" for="auditQ">Search the audit trail</label><input type="search" id="auditQ" data-bind="auditQ" placeholder="Search target, actor or detail" value="' + esc(ui.auditQ) + '">' +
      '<label class="sr-only" for="auditAction">Action</label><select id="auditAction" data-bind="auditAction">' + opt(actions, ui.auditAction, 'All actions') + '</select><label class="sr-only" for="auditActor">Actor</label><select id="auditActor" data-bind="auditActor">' + opt(actors, ui.auditActor, 'All actors') + '</select>' +
      '<label class="sr-only" for="auditRange">Time range</label><select id="auditRange" data-bind="auditRange">' + [['all', 'All time'], ['24h', 'Last 24 hours'], ['7d', 'Last 7 days']].map(function(o){ return '<option value="' + o[0] + '"' + (ui.auditRange === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
      '<button class="btn btn-ghost" type="button" style="padding:5px 12px;font-size:12px" data-act="exportAudit">Export CSV</button><span class="count" role="status">' + rows.length + ' of ' + all.length + ' events</span></div><div class="table-scroll"><table class="runs"><caption class="sr-only">Audit events, newest first</caption><thead><tr><th scope="col">When</th><th scope="col">Actor</th><th scope="col">Action</th><th scope="col">Target</th><th scope="col">Outcome</th></tr></thead><tbody>';
    if (!shown.length) html += '<tr><td colspan="5"><p class="empty-note">No events match. <button class="link" type="button" data-act="clearAudit">Clear filters</button></p></td></tr>';
    shown.forEach(function(e){
      var open = ui.auditOpen === e.id;
      html += '<tr><td class="small">' + timeEl(e.at) + '</td><td>' + esc(e.actor) + '</td><td><button class="link" type="button" data-act="auditOpen" data-id="' + e.id + '" aria-expanded="' + open + '">' + esc(e.action) + '</button></td><td class="small">' + esc(e.target) + '</td><td><span class="pill ' + (e.outcome === 'ok' ? 'pill-clean' : 'pill-flag') + '">' + esc(e.outcome) + '</span></td></tr>' +
        (open ? '<tr><td colspan="5" class="audit-detail">' + (e.detail ? esc(e.detail) : 'No further detail.') + '<br>Record #' + e.id + ' · read-only · secret values are never recorded</td></tr>' : '');
    });
    html += '</tbody></table></div>' + (rows.length > shown.length ? '<div style="padding:12px 14px"><button class="btn btn-ghost" type="button" data-act="auditMore">Load more (' + (rows.length - shown.length) + ' more)</button></div>' : '') + '</div>' +
      '<p class="small muted">Covers ' + esc(fmtDT(all[all.length - 1] ? all[all.length - 1].at : new Date())) + ' to now. No gaps are known. Audit records can’t be edited or deleted here; the only removal route is a compliance purge, which leaves a surviving record.</p>';
    $('scr-audit').innerHTML = html;
  }

  ACT.auditOpen = function(t){ var id = +t.getAttribute('data-id'); ui.auditOpen = ui.auditOpen === id ? null : id; render(); };
  ACT.auditMore = function(){ ui.auditLimit = (ui.auditLimit || 10) + 10; render(); };
  ACT.exportAudit = function(){ audit('export audit trail', 'filtered view', 'ok', 'CSV'); toast('Audit trail exported as CSV (simulated). The export is itself recorded.', 'good'); render(); };

  // =====================================================================
  //  Demo controls — MOCKUP ONLY (Constitution XII: simulation is labelled)
  // =====================================================================
  function toggleDemo(open){ var o = open === undefined ? !$('demoPanel').classList.contains('open') : open; $('demoPanel').classList.toggle('open', o); $('demoBtn').setAttribute('aria-expanded', o ? 'true' : 'false'); if (o) { renderDemo(); var f = qs('select, button, input', $('demoPanel')); if (f) f.focus(); } }
  function renderDemo(){
    $('demoPanel').innerHTML = '<h3>Demo controls</h3><p class="warn">Mockup only — these simulate situations. They are not part of the product.</p>' +
      '<fieldset><legend>Who am I</legend><label for="dRole">View as</label><select id="dRole" data-bind="dRole"><option value="">My own roles</option>' + ROLES.map(function(r){ return '<option' + (session.override === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '<option value="none"' + (session.override === 'none' ? ' selected' : '') + '>No role anywhere</option></select></fieldset>' +
      '<fieldset><legend>Session and links</legend><button class="btn btn-ghost" type="button" data-act="dExpire">Expire session</button><button class="btn btn-ghost" type="button" data-act="dDenied">Restricted link</button><button class="btn btn-ghost" type="button" data-act="dMissing">Missing link</button></fieldset>' +
      '<fieldset><legend>Conditions</legend><label><input type="checkbox" data-bind="dOffline"' + (demo.offline ? ' checked' : '') + '> Live connection lost</label><label><input type="checkbox" data-bind="dFail"' + (demo.failNext ? ' checked' : '') + '> Fail the next action</label><label><input type="checkbox" data-bind="dBlock"' + (demo.blockGen ? ' checked' : '') + '> Block generation of TC005</label></fieldset>' +
      '<fieldset><legend>Guided demo</legend><button class="btn btn-primary" type="button" data-act="dTour">Start guided tour</button><button class="btn btn-ghost" type="button" data-act="dFailPath">Failure path (one click)</button></fieldset>' +
      '<fieldset><legend>Shortcuts (this branch)</legend><button class="btn btn-ghost" type="button" data-act="dSpecs">Attach sample &amp; generate specs</button><button class="btn btn-ghost" type="button" data-act="dApprove">Approve all pending</button><button class="btn btn-ghost" type="button" data-act="dReset">Reset this branch</button></fieldset>';
  }
  function syncDemo(){ if ($('demoPanel').classList.contains('open')) renderDemo(); }
  $('demoBtn').addEventListener('click', function(){ toggleDemo(); });
  BIND.dRole = function(t){ session.override = t.value || null; audit('demo: view as', t.value || 'own roles', 'ok', 'mockup only'); lastHash = null; route(true); announce('Now viewing as ' + (t.value === 'none' ? 'a user with no role' : t.value || 'your own roles')); };
  BIND.dOffline = function(t){ demo.offline = t.checked; if (!t.checked) { toast('Reconnected. Everything on screen is up to date.', 'good'); } updateBanner(); render(); };
  BIND.dFail = function(t){ demo.failNext = t.checked; };
  BIND.dBlock = function(t){ demo.blockGen = t.checked; };
  ACT.dExpire = function(){ toggleDemo(false); returnHash = curHash; session.expired = true; showAuth('expired'); };
  ACT.dDenied = function(){ toggleDemo(false); navigate('#/p/payments-core/main/execution'); };
  ACT.dMissing = function(){ toggleDemo(false); navigate('#/p/' + ctx.pid + '/' + encodeURIComponent(ctx.branch) + '/report/run/99'); };
  ACT.dSpecs = function(){ var st = S(); if (!st.file) st.file = { name:ctx.pid + '-testcases.xlsx', size:18432, fmt:'xlsx', count:6, skipped:1, expected:'' }; if (!st.specs) st.specs = newSpecStates(st.clarifyFixed); toast('Sample attached and specs generated (demo shortcut).', 'good'); toggleDemo(false); go('specs'); };
  ACT.dApprove = function(){ var st = S(); if (!st.specs) { toast('Generate specs first.', 'warn'); return; } SPECS.forEach(function(s){ if (st.specs[s.id].status === 'pending') st.specs[s.id] = { status:'approved', by:session.user, at:new Date() }; }); toast('All pending specs approved (demo shortcut — skips per-spec confirmation).', 'warn'); render(); };
  ACT.dReset = function(){ if (runInProgress) { toast('A run is in progress — cancel it first.', 'warn'); return; } store[key(ctx.pid, ctx.branch)] = fresh(); toast('This branch was reset.', 'good'); toggleDemo(false); go('intake'); };

  // ---------- Guided demo (mockup only) ----------
  var tour = { active:false };
  function tourShow(html){
    var b = $('tourBar');
    if (!b) { b = document.createElement('div'); b.id = 'tourBar'; document.body.appendChild(b); }
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:120;width:min(640px,calc(100% - 24px))';
    b.innerHTML = html;
  }
  function tourHide(){ var b = $('tourBar'); if (b && b.parentNode) b.parentNode.removeChild(b); }
  function tourCard(step, of, title, text){
    tourShow('<div style="background:var(--ink);color:var(--panel);border-radius:var(--radius);padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35);display:flex;gap:14px;align-items:flex-start">' +
      '<div style="flex:1;min-width:0"><div style="font-family:var(--mono);font-size:10.5px;opacity:.7;margin:0 0 4px">' + (step ? 'GUIDED DEMO · STEP ' + step + ' OF ' + of : 'GUIDED DEMO') + '</div>' +
      '<div style="font-size:14.5px;font-weight:600;margin:0 0 2px">' + esc(title) + '</div>' +
      '<div style="font-size:12.5px;opacity:.85">' + esc(text) + '</div></div>' +
      '<button type="button" data-act="dTourStop" style="flex:none;background:transparent;color:inherit;border:1px solid currentColor;border-radius:var(--radius);padding:6px 10px;font-size:12px;font-family:var(--mono);cursor:pointer">Stop tour</button></div>');
  }
  function tourBegin(){
    if (tour.active) return false;
    if (runInProgress) { toast('A run is in progress — cancel it first.', 'warn'); return false; }
    tour.active = true; toggleDemo(false); tourHide();
    demo.failNext = false; demo.blockGen = false;
    return true;
  }
  function tourWaitRun(){ return new Promise(function(res){ (function poll(){ if (!runInProgress || !tour.active) return res(); setTimeout(poll, 300); })(); }); }
  ACT.dTourStop = function(){ tour.active = false; tourHide(); toast('Guided demo stopped. The state on screen is kept.', 'warn'); };

  ACT.dTour = async function(){
    if (!tourBegin()) return;
    var steps = [
      ['A clean slate', 'This branch was reset. Intake is where every run starts: an application environment and business-language test cases — not code.'],
      ['Specification — gate G1', 'The attached sample became generated specifications. A person approves each one before anything can run.'],
      ['Test generation', 'The Explorer turns approved specs into runnable tests. The code is an artifact — the spec stays the source of truth.'],
      ['Execution', 'The suite is running. A defect stays failing and visible, a safe heal is applied automatically, and one repair is held for a person at G2.'],
      ['G2 healing review', 'A heal that touches an assertion waits for a person. Approving it applies the repair and the test re-runs and passes.'],
      ['Final report', 'The report is the release evidence: results, captured evidence, decisions and the audit trail in one place.'],
      ['Tour complete', 'Everything shown was simulated for the demo. Explore freely, or press Reset this branch to start over.']
    ];
    for (var i = 0; i < steps.length; i++) {
      if (!tour.active) return;
      tourCard(i + 1, steps.length, steps[i][0], steps[i][1]);
      if (i === 0) { ACT.dReset(); await wait(2800); }
      else if (i === 1) { ACT.dSpecs(); await wait(2800); }
      else if (i === 2) { ACT.dApprove(); go('execution'); await generateTests(); }
      else if (i === 3) { go('execution'); startRun(); await tourWaitRun(); await wait(1400); }
      else if (i === 4) { go('heals'); var hp = S().heals.filter(function(h){ return h.decision === 'pending'; }); await wait(2600); if (tour.active && hp.length) { ACT.approveHeal({ getAttribute:function(){ return hp[0].id; } }); await wait(2800); } }
      else if (i === 5) { go('report'); await wait(3400); }
      else { await wait(4200); }
    }
    if (tour.active) { tour.active = false; tourHide(); }
  };

  ACT.dFailPath = async function(){
    if (!tourBegin()) return;
    tourCard(0, 0, 'Staging the failure path', 'Resetting the branch, attaching the sample, approving specs and generating tests…');
    ACT.dReset(); await wait(1200); if (!tour.active) return;
    ACT.dSpecs(); await wait(1200); if (!tour.active) return;
    ACT.dApprove(); go('execution');
    var gok = await generateTests(); if (!tour.active) return;
    if (!gok) { tour.active = false; tourHide(); return; }
    tourCard(0, 0, 'Execution — failure with a proposed repair', 'The suite is running: a defect stays failing, a safe heal is applied automatically, and one repair is held for a person at G2.');
    startRun(); await tourWaitRun(); await wait(1200); if (!tour.active) return;
    go('heals');
    tourCard(0, 0, 'Your move: approve the heal', 'This repair touches an assertion, so it waits at G2. Press Approve heal — the repair is applied and the test re-runs and passes. Then press Stop tour.');
  };

  // =====================================================================
  //  Start
  // =====================================================================
  window.__vsq = { S:S, session:session, demo:demo, PROJECTS:PROJECTS, AUDIT:AUDIT, ui:ui, ctx:function(){ return ctx; }, route:route, isRunning:function(){ return runInProgress; } };
  route(true);   // no address-bar write at start: it is forbidden inside a sandboxed frame

})();
</script>
</body>
</html>
